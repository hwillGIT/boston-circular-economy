name: Deployment readiness

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hosting-decision:
    name: Confirm hosting decision
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Report the unresolved release configuration
        run: |
          echo "Hosting and the backend destination require a maintainer decision." >> "$GITHUB_STEP_SUMMARY"
          echo "Read docs/DELIVERY_ACTIVATION.md before enabling publication." >> "$GITHUB_STEP_SUMMARY"
          echo "::error::No host-specific release procedure has been approved and tested."
          exit 1
