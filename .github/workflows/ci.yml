name: CI

on:
  push:
    branches: [main, 'feature/**']
  pull_request:
    branches: [main]
  merge_group:
    types: [checks_requested]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-client:
    name: Lint • Client
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .node-version
          cache: npm
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - run: npm run lint -w client
      - run: npm run lint:css
      - run: npm run format:check

  lint-server:
    name: Lint • Server
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .node-version
          cache: npm
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - run: npm run lint -w server

  lint-etl:
    name: Lint • ETL (Python)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: etl
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: etl/.python-version
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: '0.12.9'
          enable-cache: true
          cache-dependency-glob: etl/uv.lock
      - name: Install locked dependencies
        run: uv sync --locked --dev
      - run: uv run --locked ruff check .
      - run: uv run --locked ruff format --check .
      - run: uv run --locked mypy src/etl/merge/ --ignore-missing-imports

  typecheck:
    name: Typecheck
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    needs: [lint-client, lint-server]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .node-version
          cache: npm
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - run: npm run build -w client
      - run: npm run build -w server
      - run: npm run test -w server

  test-etl:
    name: Test • ETL
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    needs: [lint-etl]
    defaults:
      run:
        working-directory: etl
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: etl/.python-version
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: '0.12.9'
          enable-cache: true
          cache-dependency-glob: etl/uv.lock
      - name: Install locked dependencies
        run: uv sync --locked --dev
      - run: uv run --locked pytest

  docs:
    name: Docs • Generate
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    needs: [typecheck]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .node-version
          cache: npm
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Check public function documentation and links
        run: npm run docs:audit
      - name: Generate API documentation
        run: npm run docs:generate
      - name: Upload docs artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: api-docs
          path: docs/api/
          if-no-files-found: error
          retention-days: 30

  docs-python:
    name: Docs • Python
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    needs: [test-etl]
    defaults:
      run:
        working-directory: etl
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: etl/.python-version
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: '0.12.9'
          enable-cache: true
          cache-dependency-glob: etl/uv.lock
      - name: Install locked dependencies
        run: uv sync --locked --dev
      - name: Audit Python docstrings (advisory)
        id: audit
        continue-on-error: true
        run: uv run --locked pydocstyle --convention=google src/ pipelines/
      - name: Report audit result
        if: always()
        env:
          AUDIT_RESULT: ${{ steps.audit.outcome }}
        run: |
          echo "## Python docstrings" >> "$GITHUB_STEP_SUMMARY"
          echo "Advisory audit result: $AUDIT_RESULT." >> "$GITHUB_STEP_SUMMARY"
          echo "See the audit log for missing or invalid docstrings." >> "$GITHUB_STEP_SUMMARY"

  quality-gate:
    name: Quality Gate
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    if: always()
    needs: [lint-client, lint-server, lint-etl, typecheck, test-etl, docs, docs-python]
    steps:
      - name: Require successful checks
        env:
          JOB_RESULTS: ${{ toJSON(needs) }}
        run: |
          python - <<'PY'
          import json
          import os

          jobs = json.loads(os.environ["JOB_RESULTS"])
          failed = {
              name: job["result"]
              for name, job in jobs.items()
              if job["result"] != "success"
          }
          if failed:
              raise SystemExit(f"Required checks did not pass: {failed}")
          print("All required checks passed.")
          PY
