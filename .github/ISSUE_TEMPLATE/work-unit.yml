name: Ready work unit
description: Propose a small, testable unit of product or engineering work.
title: '[Work]: '
body:
  - type: markdown
    attributes:
      value: |
        Start with one result that fits a focused session. Use the frontend catalog for 60- to 90-minute research and design assignments.

  - type: textarea
    id: outcome
    attributes:
      label: Observable outcome
      description: Describe who benefits and what they will be able to observe.
      placeholder: After this change, a Boston resident can...
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Context and evidence
      description: Explain the need. Link the product requirement, research, parent issue, design, or incident.
    validations:
      required: true

  - type: dropdown
    id: work_lane
    attributes:
      label: Work lane
      description: Select the kind of artifact that this unit produces.
      options:
        - Research
        - UI specification
        - Interaction design or wireframe
        - Visual design
        - Backend-call handoff
        - Frontend implementation
        - Documentation or maintenance
        - Other
    validations:
      required: true

  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: List concrete, independently testable results.
      placeholder: |
        - [ ] Given ..., when ..., then ...
        - [ ] The failure state tells the user how to recover.
        - [ ] Automated tests cover ...
    validations:
      required: true

  - type: textarea
    id: scope
    attributes:
      label: In scope
      description: Name the behavior, components, or data included in this unit.
    validations:
      required: true

  - type: textarea
    id: out_of_scope
    attributes:
      label: Out of scope
      description: Name nearby work that belongs in another issue.
    validations:
      required: true

  - type: textarea
    id: dependencies
    attributes:
      label: Start condition, dependencies, and decisions
      description: Name the accepted input. Link blockers or state "None." Name an unresolved product or architecture decision.
    validations:
      required: true

  - type: dropdown
    id: size
    attributes:
      label: Expected size
      description: Use these sizes during triage. Split work that is larger or uncertain before a developer claims it.
      options:
        - XS — 15 to 45 minutes
        - S — 45 to 120 minutes
        - M — two to four focused sessions
        - L or unknown — split before assignment
    validations:
      required: true

  - type: dropdown
    id: risk
    attributes:
      label: Review level
      description: Use Yellow if uncertain. The code standard defines each level.
      options:
        - Green — docs, prototype, isolated style, or safe internal refactor
        - Yellow — user behavior, API, data transformation, or business logic
        - Red — authentication, privacy, destructive action, migration, or critical accessibility
    validations:
      required: true

  - type: checkboxes
    id: evidence
    attributes:
      label: Expected evidence
      description: Select checks that provide evidence for the observable outcome.
      options:
        - label: Unit or component test
        - label: Integration or contract test
        - label: End-to-end journey test
        - label: Accessibility or responsive check
        - label: Security, privacy, or recovery check
        - label: Screenshot, recording, log, or data sample
        - label: Documentation-only review
    validations:
      required: true

  - type: textarea
    id: deliverable
    attributes:
      label: Deliverable and AI prompts
      description: Link the manifest or name the artifact, format, timebox, and copyable AI prompts.
    validations:
      required: true

  - type: textarea
    id: explanation
    attributes:
      label: Explain the result
      description: Name one example to trace, one alternative to compare, and the reviewer who will check the explanation.
    validations:
      required: true

  - type: textarea
    id: mentoring
    attributes:
      label: Mentoring support requested
      description: Name the decision, skill, or checkpoint where a contributor wants help. State "None" if no support is needed.
      placeholder: I would like a 15-minute checkpoint before changing the API contract.
    validations:
      required: true

  - type: textarea
    id: handoff
    attributes:
      label: Claim and handoff
      description: State the contributor claim, expected artifact, next decision owner, and next unit or question.
      placeholder: |
        Claim: UI-001 research after checking the current requirements.
        Handoff: Product or design owner accepts the note or names the missing decision.
    validations:
      required: true

  - type: checkboxes
    id: ready
    attributes:
      label: Ready-for-work check
      options:
        - label: The outcome and acceptance criteria are testable.
          required: true
        - label: The unit can be completed without an unstated product or architecture decision.
          required: true
        - label: The start condition and next decision owner are named.
          required: true
        - label: The issue contains no secret, credential, or personally identifiable information.
          required: true
